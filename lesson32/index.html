<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Movie Search</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="container">
      <h1 class="title">Live Movie Search</h1>
      <p class="subtitle">Search movies in real time using OMDb API</p>

      <input
        type="text"
        id="searchInput"
        class="search-input"
        placeholder="Enter movie title..."
      />

      <div id="results" class="results">
        <p class="message">Start typing to search for movies</p>
      </div>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
